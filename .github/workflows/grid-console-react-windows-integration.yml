name: Grid Console React Windows Integration - Offline Gate
on:
  push:
    branches: [feat/grid-console-react-windows-integration-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  react-python-contracts:
    name: compiled-react-and-local-sqlite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LIVE_TRADING: 'false'
      DRY_RUN: 'true'
      ACCOUNT_NETWORK_TESTS: 'DISABLED'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Strict TypeScript check
        working-directory: frontend
        run: npm run typecheck
      - name: React API contract and rendered risk state tests
        working-directory: frontend
        run: npm test
      - name: Compile real Vite assets
        working-directory: frontend
        run: npm run build
      - name: Install offline Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend, desktop launcher and tests
        run: python -m compileall -q product_shell windows_distribution scripts tests
      - name: Verify real compiled bundle via localhost
        run: python -m unittest tests.test_react_built_bundle -v
      - name: Verify SQLite, risk lock, HTTP and legacy rollback
        run: python -m unittest tests.test_react_server_integration tests.test_grid_console_desktop_gui tests.test_local_supervisor_view -v
      - name: Full existing trading safety regression
        run: python -m unittest discover -s tests -v
      - name: Verify release gate remains NO_GO
        run: python scripts/check_grid_console_release_gate.py --output integration-evidence/release-no-go.json
      - name: Verify no real account and no mutations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from windows_distribution.grid_console_desktop import status_through_loopback
          report = status_through_loopback(react_root=Path("frontend/dist"))
          assert report["ui"] == "GRID_CONSOLE_REACT_LOCAL_GUI"
          assert report["runtime_status"] == "NOT_CONFIGURED"
          assert report["react_assets"] >= 2
          assert report["live_orders"] == "DISABLED"
          assert report["exchange_mutations"] == 0
          assert report["sellable_product"] == "NO_GO"
          print("REACT_LOCAL_ONLY_PASS")
          PY
      - name: Archive redacted release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-python-local-contract-${{ matrix.os }}
          path: integration-evidence/*.json
          if-no-files-found: warn
