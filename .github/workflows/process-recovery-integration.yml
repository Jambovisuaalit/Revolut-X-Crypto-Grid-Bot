name: Process Recovery Integration
on:
  push:
    branches:
      - test/process-recovery-integration
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process-recovery-integration:
    name: process-recovery-integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Crash, restart, reconcile, verify no duplicate POST
        env:
          LIVE_TRADING: 'false'
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/process_recovery_integration.py
      - name: Upload recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-recovery-${{ matrix.os }}
          path: recovery-artifacts/*.json
          if-no-files-found: error
