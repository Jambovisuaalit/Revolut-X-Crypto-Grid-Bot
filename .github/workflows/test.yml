name: Trading Core Safety Tests
on:
  push:
    branches:
      - fix/revx-contract-idempotent-recovery
  pull_request:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q bot_main.py grid_executor.py precision_engine.py revolut_x_client.py tests
      - name: Offline official API and fault-injection suite
        run: python -m unittest discover -s tests -v

      - name: Read-only official public API smoke probe (non-gating)
        continue-on-error: true
        env:
          LIVE_TRADING: "false"
        run: python scripts/public_api_readonly_probe.py
