name: Trading Core Safety Tests
on:
  push:
    branches:
      - fix/revx-contract-idempotent-recovery
  pull_request:
permissions:
  contents: read
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q bot_main.py grid_executor.py precision_engine.py revolut_x_client.py tests
      - name: Offline official API and fault-injection suite
        run: python -m unittest discover -s tests -v

      - name: Offline drawdown restart integration
        env:
          LIVE_TRADING: 'false'
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/drawdown_integration.py
      - name: Upload drawdown JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawdown-${{ matrix.os }}
          path: recovery-artifacts/drawdown-*.json
          if-no-files-found: error

      - name: Read-only official public API smoke probe (non-gating)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          LIVE_TRADING: "false"
        run: python scripts/public_api_readonly_probe.py
